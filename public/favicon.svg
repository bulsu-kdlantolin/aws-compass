<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    /* Default: Dark Browser Tab Bar (prefers-color-scheme: dark) */
    .fav-tile { fill: #FF9900; }
    .fav-dial { stroke: #0F141A; stroke-width: 1.2; fill: none; opacity: 0.75; }
    .fav-track { stroke: #0F141A; stroke-width: 0.75; stroke-dasharray: 1.2 1.5; fill: none; opacity: 0.4; }
    .fav-tick { stroke: #0F141A; stroke-width: 1.8; stroke-linecap: round; }
    .fav-tick-sub { stroke: #0F141A; stroke-width: 1.2; stroke-linecap: round; opacity: 0.65; }
    .fav-pointer { fill: #0F141A; }
    .fav-tail { fill: #FFFFFF; }
    .fav-pin { fill: #FF9900; stroke: #0F141A; stroke-width: 0.8; }

    /* Light Browser Tab Bar (prefers-color-scheme: light) */
    @media (prefers-color-scheme: light) {
      .fav-tile { fill: #232F3E; }
      .fav-dial { stroke: #FFFFFF; stroke-width: 1.2; fill: none; opacity: 0.75; }
      .fav-track { stroke: #FFFFFF; stroke-width: 0.75; stroke-dasharray: 1.2 1.5; fill: none; opacity: 0.4; }
      .fav-tick { stroke: #FFFFFF; stroke-width: 1.8; stroke-linecap: round; }
      .fav-tick-sub { stroke: #FFFFFF; stroke-width: 1.2; stroke-linecap: round; opacity: 0.65; }
      .fav-pointer { fill: #FF9900; }
      .fav-tail { fill: #FFFFFF; }
      .fav-pin { fill: #232F3E; stroke: #FF9900; stroke-width: 0.8; }
    }
  </style>

  <!-- Outer Circular Bezel / Compass Body -->
  <circle class="fav-tile" cx="16" cy="16" r="15" />

  <!-- Inner Precision Dial Ring -->
  <circle class="fav-dial" cx="16" cy="16" r="12.8" />

  <!-- Azimuth Graduation Track -->
  <circle class="fav-track" cx="16" cy="16" r="10.4" />

  <!-- Major Cardinal Ticks (N, E, S, W) -->
  <line class="fav-tick" x1="16" y1="2.2" x2="16" y2="5.6" />
  <line class="fav-tick" x1="16" y1="26.4" x2="16" y2="29.8" />
  <line class="fav-tick" x1="2.2" y1="16" x2="5.6" y2="16" />
  <line class="fav-tick" x1="26.4" y1="16" x2="29.8" y2="16" />

  <!-- Minor Ordinal Ticks (NE, SE, SW, NW) -->
  <line class="fav-tick-sub" x1="23.5" y1="8.5" x2="25.8" y2="6.2" />
  <line class="fav-tick-sub" x1="23.5" y1="23.5" x2="25.8" y2="25.8" />
  <line class="fav-tick-sub" x1="8.5" y1="23.5" x2="6.2" y2="25.8" />
  <line class="fav-tick-sub" x1="8.5" y1="8.5" x2="6.2" y2="6.2" />

  <!-- Directional Compass Needle -->
  <polygon class="fav-pointer" points="16,16 13.6,13.6 22.8,9.2 18.4,18.4" />
  <polygon class="fav-tail" points="16,16 18.4,18.4 9.2,22.8 13.6,13.6" />

  <!-- Center Pivot Pin -->
  <circle class="fav-pin" cx="16" cy="16" r="1.8" />
</svg>