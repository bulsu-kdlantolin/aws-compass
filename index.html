<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWS Compass · Cloud Architecture & Study Vault</title>
    <meta name="description" content="AWS Compass: Developer-grade AWS architecture study vault, 6-part service dossiers, interactive Mermaid flows, and diagram sandbox." />
    <!-- Local Amazon Ember & Amazon Ember Mono Fonts Preload -->
    <link rel="preload" href="/fonts/AmazonEmber-Regular.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/fonts/AmazonEmber-Bold.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/fonts/AmazonEmberMono-Regular.woff" as="font" type="font/woff" crossorigin />
    <!-- Amazon Ember CDN Fallback -->
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/amazon-ember" />
    <!-- Google Fonts Fallbacks: Open Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark light;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #0F141A;
        color: #EAEDED;
        font-family: "Amazon Ember", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      @media (prefers-color-scheme: light) {
        body:not(.dark) {
          background-color: #F2F3F3;
          color: #16191F;
        }
      }
      html.light body {
        background-color: #F2F3F3;
        color: #16191F;
      }
      html.dark body {
        background-color: #0F141A;
        color: #EAEDED;
      }

      /* Pre-React Zero-Flash Official Compass Keyframes */
      @keyframes compass-spin-real {
        0% { transform: rotate(0deg); }
        35% { transform: rotate(395deg); }
        50% { transform: rotate(335deg); }
        65% { transform: rotate(372deg); }
        78% { transform: rotate(354deg); }
        88% { transform: rotate(362deg); }
        94% { transform: rotate(360deg); }
        97% { transform: rotate(361.5deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes compass-track-rot {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes compass-progress {
        0% { width: 1%; }
        25% { width: 28%; }
        60% { width: 68%; }
        100% { width: 90%; }
      }
      .pre-needle {
        transform-origin: 12px 12px;
        animation: compass-spin-real 3.2s ease-in-out infinite;
      }
      .pre-track {
        transform-origin: 42px 42px;
        animation: compass-track-rot 24s linear infinite;
      }
      .pre-progress-line {
        height: 100%;
        width: 1%;
        background: #FF9900;
        border-radius: 9999px;
        box-shadow: 0 0 10px rgba(255, 153, 0, 0.65);
        animation: compass-progress 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @media (prefers-reduced-motion: reduce) {
        .pre-needle {
          animation: none !important;
          transform: rotate(0deg);
        }
        .pre-track, .pre-progress-line {
          animation: none !important;
        }
      }
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('aws-compass-theme');
          if (t === 'light') {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch(e){}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;user-select:none;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:1.5rem;max-width:20rem;width:100%;">
          <div style="position:relative;width:84px;height:84px;display:flex;align-items:center;justify-content:center;">
            <!-- Ambient Glow -->
            <div style="position:absolute;inset:-16px;border-radius:9999px;background:rgba(255,153,0,0.18);filter:blur(20px);pointer-events:none;"></div>
            
            <!-- Outer Degree Track -->
            <svg width="84" height="84" viewBox="0 0 84 84" style="position:absolute;inset:0;pointer-events:none;" class="pre-track">
              <circle cx="42" cy="42" r="40" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 6" opacity="0.5"></circle>
            </svg>

            <!-- Official AWS Compass Logo -->
            <div style="position:relative;width:72px;height:72px;display:flex;align-items:center;justify-content:center;border-radius:9999px;box-shadow:0 12px 32px rgba(255,153,0,0.3);">
              <svg width="72" height="72" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow:visible;">
                <!-- Outer Casing -->
                <circle cx="12" cy="12" r="11" fill="#FF9900" stroke="rgba(255, 255, 255, 0.35)" stroke-width="0.8"></circle>
                <!-- Precision Ring -->
                <circle cx="12" cy="12" r="9.5" stroke="#0F141A" stroke-width="0.8" opacity="0.8" fill="none"></circle>
                <!-- Azimuth Track -->
                <circle cx="12" cy="12" r="7.75" stroke="#0F141A" stroke-width="0.5" stroke-dasharray="0.8 1.2" opacity="0.45" fill="none"></circle>
                <!-- Cardinal Ticks -->
                <line x1="12" y1="1.6" x2="12" y2="4.2" stroke="#0F141A" stroke-width="1.2" stroke-linecap="round"></line>
                <line x1="12" y1="19.8" x2="12" y2="22.4" stroke="#0F141A" stroke-width="1.2" stroke-linecap="round"></line>
                <line x1="1.6" y1="12" x2="4.2" y2="12" stroke="#0F141A" stroke-width="1.2" stroke-linecap="round"></line>
                <line x1="19.8" y1="12" x2="22.4" y2="12" stroke="#0F141A" stroke-width="1.2" stroke-linecap="round"></line>
                <!-- Ordinal Ticks -->
                <line x1="17.6" y1="6.4" x2="19.2" y2="4.8" stroke="#0F141A" stroke-width="0.8" stroke-linecap="round" opacity="0.7"></line>
                <line x1="17.6" y1="17.6" x2="19.2" y2="19.2" stroke="#0F141A" stroke-width="0.8" stroke-linecap="round" opacity="0.7"></line>
                <line x1="6.4" y1="17.6" x2="4.8" y2="19.2" stroke="#0F141A" stroke-width="0.8" stroke-linecap="round" opacity="0.7"></line>
                <line x1="6.4" y1="6.4" x2="4.8" y2="4.8" stroke="#0F141A" stroke-width="0.8" stroke-linecap="round" opacity="0.7"></line>
                <!-- Spinning Compass Needle -->
                <g class="pre-needle">
                  <polygon points="12,12 10.2,10.2 17,7 13.8,13.8" fill="#0F141A"></polygon>
                  <polygon points="12,12 13.8,13.8 7,17 10.2,10.2" fill="#FFFFFF"></polygon>
                  <circle cx="12" cy="12" r="1.35" fill="#FF9900" stroke="#0F141A" stroke-width="0.6"></circle>
                  <circle cx="12" cy="12" r="0.5" fill="#0F141A"></circle>
                </g>
              </svg>
            </div>
          </div>

          <div style="display:flex;flex-direction:column;align-items:center;gap:0.5rem;text-align:center;width:100%;">
            <span style="font-size:16px;font-weight:700;letter-spacing:-0.01em;">AWS Compass</span>
            <div style="font-size:12px;font-weight:500;opacity:0.8;">Loading AWS Compass…</div>
            <div style="width:220px;height:3.5px;border-radius:9999px;overflow:hidden;background:rgba(213,219,219,0.25);margin-top:0.25rem;position:relative;">
              <div class="pre-progress-line"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
