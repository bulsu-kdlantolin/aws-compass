<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWS Compass · Cloud Architecture & Study Vault</title>
    <meta name="description" content="AWS Compass: Developer-grade AWS architecture study vault, 6-part service dossiers, interactive Mermaid flows, and diagram sandbox." />
    <!-- Local Amazon Ember & Amazon Ember Mono Fonts Preload -->
    <link rel="preload" href="/fonts/AmazonEmber-Regular.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/fonts/AmazonEmber-Bold.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/fonts/AmazonEmberMono-Regular.woff" as="font" type="font/woff" crossorigin />
    <!-- Amazon Ember CDN Fallback -->
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/amazon-ember" />
    <!-- Google Fonts Fallbacks: Open Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark light;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #0F141A;
        color: #EAEDED;
        font-family: "Amazon Ember", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      @media (prefers-color-scheme: light) {
        body:not(.dark) {
          background-color: #F2F3F3;
          color: #16191F;
        }
      }
      html.light body {
        background-color: #F2F3F3;
        color: #16191F;
      }
      html.dark body {
        background-color: #0F141A;
        color: #EAEDED;
      }

      /* Pre-React Zero-Flash Compass Keyframes */
      @keyframes compass-seek {
        0% { transform: rotate(0deg); }
        14% { transform: rotate(-35deg); }
        42% { transform: rotate(110deg); }
        62% { transform: rotate(30deg); }
        78% { transform: rotate(52deg); }
        88% { transform: rotate(45deg); }
        100% { transform: rotate(405deg); }
      }
      @keyframes compass-track-rot {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes compass-shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
      .pre-needle {
        transform-origin: 36px 36px;
        animation: compass-seek 2.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .pre-track {
        transform-origin: 36px 36px;
        animation: compass-track-rot 20s linear infinite;
      }
      .pre-shimmer {
        animation: compass-shimmer 1.4s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .pre-needle {
          animation: none !important;
          transform: rotate(45deg);
        }
        .pre-track, .pre-shimmer {
          animation: none !important;
        }
      }
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('aws-compass-theme');
          if (t === 'light') {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch(e){}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;user-select:none;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:1.25rem;max-width:20rem;width:100%;">
          <div style="position:relative;width:72px;height:72px;display:flex;align-items:center;justify-content:center;">
            <!-- Ambient Glow -->
            <div style="position:absolute;inset:-12px;border-radius:9999px;background:rgba(255,153,0,0.12);filter:blur(16px);pointer-events:none;"></div>
            
            <!-- Degree Track -->
            <svg width="72" height="72" viewBox="0 0 72 72" style="position:absolute;inset:0;pointer-events:none;" class="pre-track">
              <circle cx="36" cy="36" r="34" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 6" opacity="0.4"></circle>
            </svg>

            <!-- Isometric AWS Hexagon Cube -->
            <svg width="72" height="72" viewBox="0 0 72 72" fill="none" style="position:absolute;inset:0;pointer-events:none;">
              <polygon points="36,18 51.6,27 36,36 20.4,27" fill="#FF9900" fill-opacity="0.14"></polygon>
              <polygon points="20.4,27 36,36 36,54 20.4,45" fill="#232F3E" fill-opacity="0.5"></polygon>
              <polygon points="51.6,27 36,36 36,54 51.6,45" fill="#16191F" fill-opacity="0.75"></polygon>
              <path d="M 36,18 L 51.6,27 L 51.6,45 L 36,54 L 20.4,45 L 20.4,27 Z" stroke="#545B64" stroke-width="1.25" stroke-linejoin="round" fill="none"></path>
              <line x1="36" y1="36" x2="36" y2="54" stroke="#545B64" stroke-width="1" opacity="0.6"></line>
              <line x1="36" y1="36" x2="20.4" y2="27" stroke="#545B64" stroke-width="1" opacity="0.6"></line>
              <line x1="36" y1="36" x2="51.6" y2="27" stroke="#545B64" stroke-width="1" opacity="0.6"></line>
            </svg>

            <!-- Magnetic Seeking Needle -->
            <svg width="72" height="72" viewBox="0 0 72 72" style="position:absolute;inset:0;pointer-events:none;" class="pre-needle">
              <polygon points="36,15 33,36 36,36" fill="#ED7100"></polygon>
              <polygon points="36,15 36,36 39,36" fill="#FF9900"></polygon>
              <polygon points="36,57 33,36 36,36" fill="#D5DBDB"></polygon>
              <polygon points="36,57 36,36 39,36" fill="#FFFFFF"></polygon>
              <circle cx="36" cy="36" r="3.5" fill="#0F141A" stroke="#FF9900" stroke-width="1"></circle>
              <circle cx="36" cy="36" r="1.2" fill="#FF9900"></circle>
            </svg>
          </div>

          <div style="display:flex;flex-direction:column;align-items:center;gap:0.375rem;text-align:center;">
            <div style="font-size:15px;font-weight:700;letter-spacing:-0.01em;">AWS Compass</div>
            <div style="font-size:12px;font-family:monospace;opacity:0.75;">Mounting IndexedDB catalog…</div>
            <div style="width:120px;height:2px;border-radius:9999px;overflow:hidden;background:rgba(213,219,219,0.3);margin-top:0.25rem;position:relative;">
              <div class="pre-shimmer" style="height:100%;width:33.333%;background:#FF9900;border-radius:9999px;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
